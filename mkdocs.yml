site_name:  Aoi Skywalker's Daily Blog
site_url:   https://aoiskywalker.github.io/daily_blog/

theme:
  name:     material
  language: en
  custom_dir: overrides
  features: 
    - navigation.tabs
    - navigation.sections
    - navigation.expands
    - navigation.instant
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    # - toc.integrate
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
  font:
    text: Roboto
    code: Roboto Mono
  # icon:
    # tag:
      # <identifier>: <icon>
    # logo: material/google_analytics
  palette:
    - media:    "(prefers-color-scheme: light)"
      scheme:   default
      primary:  indigo
      accent:   indigo
      toggle:
        icon:   material/weather-sunny
        name:   "Turn to dark mode"
    - media:    "(prefers-color-scheme: dark)"
      scheme:   slate
      primary:  black
      accent:   cyan
      toggle:
        icon:   material/weather-night
        name:   "Turn on light mode"


plugins:
  - tags:
      tags_file: tags.md
  - awesome-pages:
      collapse_single_pages: true

# extra:
  # tags:
    # <tag>: <identifier>

markdown_extensions:
  - pymdownx.highlight: 
      anchor_linenums: true
      line_spans:      __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheet/extra.css